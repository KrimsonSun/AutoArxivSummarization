[project]
name = "refined-summarization"
version = "0.1.0"
description = "Multi-agent debate summarizer for arXiv papers (RefinedSummarization module)"
requires-python = ">=3.11"
dependencies = [
    # LLM SDKs
    "openai>=1.54.0",
    "anthropic>=0.39.0",
    "google-genai>=0.3.0",
    # Data validation / settings
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Templating + config
    "jinja2>=3.1.4",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    # PDF parsing
    "pdfplumber>=0.11.4",
    "pypdf>=5.1.0",
    # HTTP / async
    "httpx>=0.27.2",
    "tenacity>=9.0.0",
    # Logging
    "structlog>=24.4.0",
    # Token counting
    "tiktoken>=0.8.0",
    # Web server (optional, for §13.2)
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-multipart>=0.0.12",
    # Type export to TS (optional, for §13.3)
    "pydantic-to-typescript>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.7.0",
]

[project.scripts]
arxiv-summarize = "src.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
