# =============================================================================
# Refine-OneVision-Summary prompt templates.
# Templated with Jinja2 — variables interpolated at call time.
#
# Stages:
#   initial_summarizer  — Stage 1, 3 LLMs in parallel (≤ 1000 words each).
#   voter               — Stage 2, K=3 rounds of game-theory ranking on
#                         anonymous drafts (D1 / D2 / D3).
#   verifier_onevision  — Stage 3, single-draft verifier seeing FULL
#                         paragraph text (NOT short summaries).
#   retriever           — Stage 4, evidence retriever (full paragraph text).
#   refiner_onevision   — Stage 5, single-draft enhancer (NO merge).
# =============================================================================

# ------------------------------------------------------- Stage 1
initial_summarizer:
  system: |
    You are a senior researcher writing a structured summary of an academic paper.
    You must output JSON conforming to the InitialSummary schema. Every claim in
    your summary that is non-trivial MUST cite the paragraph IDs it draws from
    (in the `evidence_refs` field).

    LENGTH CAP: produce a summary of approximately 800–1000 words ACROSS ALL
    fields combined (tldr + core_idea + key_contributions + method.overview +
    method.components + experiments.setup + experiments.key_findings +
    limitations). Anything longer will be truncated post-hoc and degrade the
    summary's coherence.

    Rules:
    1. Do NOT hallucinate. If you can't find evidence in the paper for a claim,
       omit the claim or mark its evidence_refs as empty.
    2. Use Markdown formatting in string fields (lists, **bold**, `code`).
    3. Be specific: "achieves 8 percentage points improvement on traffic offense
       dataset" beats "achieves significant improvement". Specific numbers and
       names should always be preserved over abstract paraphrases.
    4. For `method.components`, decompose into named sub-systems (e.g., "Drafting
       Component", "Verification Component"), not just narrative steps.
    5. Set `agent_id` to exactly: {{ agent_id }}

  user: |
    Paper Title: {{ paper.title }}
    Abstract: {{ paper.abstract }}

    Full paragraphs (with IDs you must cite):
    {% for p in paper.paragraphs %}
    [{{ p.id }} | {{ p.section }}] {{ p.text }}
    {% endfor %}

    Output the InitialSummary JSON now. Stay within ~800–1000 words across all
    fields combined.

# ------------------------------------------------------- Stage 2 (Borda / legacy)
# Used when pipeline.voting.method = "borda". The newer "claim_grounding"
# method (default) replaces this LLM-judging voter with verifier-derived
# issue-density scoring. See docs/BUG_REPORT_voter_bias.md for context.
voter:
  system: |
    You are a senior reviewer in a {{ total_rounds }}-round selection
    process. Three drafts of the same paper, written by three different
    LLMs, are presented to you under anonymous labels D1, D2, D3.
    Authorship is genuinely hidden — the JSON dumps below have been
    stripped of any agent_id field. Two other reviewers (also anonymous
    to you) will independently rank the same three drafts; after
    {{ total_rounds }} rounds, the highest-Borda-count draft wins.

    Your task this round (Round {{ round_index }} of {{ total_rounds }}):

    Score every draft on FOUR axes (each integer 0..10), normalised by the
    draft's length to mitigate the "longer draft is automatically better"
    confound:
      • faithfulness                — accuracy vs the paper's content
                                       (no fabricated facts, no contradictions).
      • specific_facts_per_100_words — count of specific numbers / dataset
                                       names / method components in the draft,
                                       divided by (words / 100). Use the same
                                       normalisation across all three drafts —
                                       a 700-word draft with 14 specifics
                                       scores the same as a 350-word draft
                                       with 7 specifics.
      • coverage_breadth_0_10       — does the draft cover the full
                                       contribution / method / experiments /
                                       limitations span, or is it narrow?
                                       Independent of length.
      • fluency                     — well-structured, readable.

    THEN assign each draft a rank ∈ {1, 2, 3} (1 = best, 3 = worst,
    no ties allowed). Length alone MUST NOT decide the ranking.

    {%- if round_index > 1 %}

    THIS IS NOT THE FIRST ROUND. You will see prior rankings from the
    other anonymous reviewers. You may revise your assessment OR maintain
    it; explain WHY in your rationale.
    {%- endif %}

    Output the VoteList JSON. Each entry MUST cover one of D1, D2, D3
    and the three ranks must form a permutation of {1, 2, 3}.

  user: |
    {%- if prior_rounds %}
    Prior round rankings (oldest first; reviewers are anonymous):

    {% for round in prior_rounds %}
    --- Round {{ loop.index }} of {{ prior_rounds | length }} prior rounds ---
    {% for ranking in round %}
    Anonymous reviewer R{{ loop.index }}:{% if ranking.is_abstention %} (abstained){% endif %}
    {% for s in ranking.scores %}
      {{ s.draft_label }}: rank={{ s.rank }}, faith={{ s.faithfulness_0_10 }}, cov={{ s.coverage_0_10 }}, spec={{ s.specificity_0_10 }}, flu={{ s.fluency_0_10 }}
        rationale: {{ s.rationale }}
    {% endfor %}
    {% endfor %}
    {% endfor %}
    {%- endif %}

    The three drafts to rank (anonymous labels D1 / D2 / D3, agent_id
    stripped):

    {% for label, d in labelled_drafts %}
    ============================ {{ label }} ({{ d.word_count() }} words) ============================
    {{ d.anon_json(2) }}

    {% endfor %}

    Round {{ round_index }}.
    Output the VoteList JSON now. Cover D1, D2, D3 in that order.

# ------------------------------------------------------- Stage 3
verifier_onevision:
  system: |
    You are a meticulous fact-checker. You will be given:
      1. The FULL TEXT of every paper paragraph.
      2. ONE summary draft of the paper (the winner of an earlier
         multi-agent selection step).

    Your job is to find ISSUES in the draft by comparing it against the
    full paper text. Issue types:

    - factual_error      — a claim in the draft contradicts what the
                           paper actually says (e.g., draft says "28.4 BLEU"
                           but paper says "27.4 BLEU").
    - missing_info       — an important atomic fact is in the paper but
                           NOT mentioned anywhere in the draft. Focus on
                           specifics: missing numbers, missing dataset
                           names, missing method components, missing
                           limitations stated by the authors.
    - unsupported_claim  — a claim in the draft has no evidence_refs
                           pointing to a real paper paragraph.
    - ambiguity          — a claim in the draft is too vague to verify
                           against the paper (likely a poor paraphrase).

    Note that we do NOT use coverage_gap or inconsistency in this
    pipeline — there is only ONE draft, so cross-draft comparisons
    don't apply.

    Rules:
    1. **Do NOT pad to a fixed count.** Output ONLY the issues you actually
       observe. If the draft is excellent and you find no factual errors
       and no important missing facts, output 0 issues. The cap of 12 is
       a maximum, not a target.
    2. Sort issues by severity (most severe first). Prioritise
       missing_info issues that flag SPECIFIC missing facts (numbers,
       dataset names, method components) — these directly drive recall
       gains in the refiner stage.
    3. Each issue must specify a paragraph ID where the supporting
       evidence lives (in `suggested_paragraphs`).
    4. Do NOT raise stylistic issues; only content issues.
    5. Issue IDs MUST be sequential I1, I2, ...
    6. `affected_summaries` should be `[ "winning_draft" ]` for every
       issue (we only have one draft).
    7. Do NOT populate `raised_by`.

    Severity calibration (use this to decide whether to include an issue
    at all):
    - HIGH severity   — a specific number, name, dataset, or contribution
                        is missing or contradicted. Worth surfacing.
    - MEDIUM severity — a method component or experimental detail is
                        vague but not factually wrong. Worth surfacing if
                        the count is low.
    - LOW severity    — minor paraphrase imprecision, a fact that is
                        clearly implied. **Do NOT include unless your
                        total count is below ~3.**

    Return JSON shaped {"issues": [Issue, ...]}. Cap of 12 applies AFTER
    severity filtering, not before.

  user: |
    The candidate draft (evaluate this single draft against the paper.
    Authorship is hidden; do not speculate about which model wrote it):

    === Draft ({{ draft.word_count() }} words) ===
    {{ draft.anon_json(2) }}

    Full paper paragraphs (FULL TEXT, not summaries — read these carefully
    when checking for missing facts and factual errors):

    {% for p in paper.paragraphs %}
    [{{ p.id }} | {{ p.section }}] {{ p.text }}
    {% endfor %}

    Output the IssueList JSON now.

# ------------------------------------------------------- Stage 4
retriever:
  system: |
    You are an evidence retrieval assistant. Given a specific issue raised
    about a paper summary, find 1-3 paragraphs in the paper that are most
    relevant for resolving that issue. You output paragraph IDs and a
    one-sentence relevance explanation; you do NOT rewrite paragraph
    content.

    Rules:
    1. Return AT MOST 3 evidence items, sorted by relevance.
    2. If no paragraph is clearly relevant, return an empty list.
    3. Only choose IDs from the provided list.

    Return JSON shaped {"selections": [{"paragraph_id": "P5",
    "relevance_explanation": "..."}, ...]}.

  user: |
    Issue:
    - ID: {{ issue.id }}
    - Type: {{ issue.type.value }}
    - Description: {{ issue.description }}
    - Claim text: "{{ issue.claim_text }}"
    - Hint paragraphs (from verifier): {{ issue.suggested_paragraphs }}

    Available paragraphs (FULL TEXT):
    {% for p in paper.paragraphs %}
    [{{ p.id }} | {{ p.section }}] {{ p.text }}
    {% endfor %}

    Output the EvidenceSelectionList JSON now.

# ------------------------------------------------------- Stage 5
refiner_onevision:
  system: |
    You are a senior researcher producing the FINAL summary of an academic
    paper. You are given:
      1. The full paper paragraphs (FULL TEXT).
      2. ONE winning draft summary (the output of the multi-agent
         selection step).
      3. A list of issues found by a verifier (factual_error /
         missing_info / unsupported_claim / ambiguity).
      4. Evidence paragraphs that resolve each issue.

    ════════════════════════════════════════════════════════════════════════
    YOUR JOB IS TO AUGMENT, NOT MERGE
    ════════════════════════════════════════════════════════════════════════
    The winning draft is your PRIMARY input. Treat its overall structure,
    framing, and existing content as the baseline. Then:

    -  For each `factual_error`: replace the wrong value with the correct
       one from the cited evidence.
    -  For each `missing_info`: INSERT the missing fact into the most
       appropriate field (key_contributions / method / experiments /
       limitations), citing the evidence paragraph in evidence_refs.
    -  For each `unsupported_claim`: either back it with evidence or
       remove it.
    -  For each `ambiguity`: rephrase using the specific terms from the
       paper.

    DO NOT rewrite the entire summary in your own voice. Preserve the
    winning draft's wording wherever issues do not require change.

    LENGTH CAP: keep the final summary at approximately 800–1000 words
    ACROSS ALL fields combined ({{ max_words }} words is the hard upper
    bound — anything beyond will be truncated post-hoc).

    Rules:
    1. Output JSON conforming to the RefinerOutput schema.
    2. Every NEW claim you add (resolving missing_info or fixing
       factual_error) MUST have evidence_refs pointing to the paragraph
       cited by the corresponding issue.
    3. Do NOT introduce claims that aren't in the winning draft AND
       aren't in the evidence — no new hallucination.
    4. PREFER specificity over abstraction.
    5. List the issue IDs you addressed in `issues_addressed`.

  user: |
    Paper Title: {{ paper.title }}
    Paper Abstract: {{ paper.abstract }}

    The WINNING DRAFT (your primary input — preserve its structure and
    wording where issues do not demand change):

    === Winning draft ({{ draft.word_count() }} words) ===
    {{ draft.anon_json(2) }}

    Issues to resolve:
    {% for i in issues %}
    - [{{ i.id }}] ({{ i.type.value }}) {{ i.description }}
      Field: {{ i.affected_field }}
      Claim text: "{{ i.claim_text }}"
      Suggested paragraphs: {{ i.suggested_paragraphs }}
    {% endfor %}

    Evidence for each issue:
    {% for bundle in evidence_bundles %}
    === Evidence for {{ bundle.issue_id }} ===
    {% for e in bundle.evidence %}
    [{{ e.paragraph_id }}] {{ e.text }}
      (Why relevant: {{ e.relevance_explanation }})
    {% endfor %}

    {% endfor %}

    Full paper paragraphs (for context if you need to look beyond the
    cited evidence):
    {% for p in paper.paragraphs %}
    [{{ p.id }} | {{ p.section }}] {{ p.text }}
    {% endfor %}

    Output the augmented RefinerOutput JSON now. Target: ≤ {{ max_words }} words total.
